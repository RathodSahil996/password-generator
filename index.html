<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeHelp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        
            <h1>PASSWORD GENERATOR</h1>

            <div class="display-container">
                <input readonly placeholder="Password" class="display" data-passwordDisplay>
                
                <button data-copy>
                    <span data-copyMsg></span>
                     <img src="./assets/copy.svg" alt="copy" width="23" height="23">
                </button>
            </div>

            <div class="input-container">

                password lenght section
                <div>
                    <p>Passwrod Lenght</p> 
                    <p data-lenghtNumber>0</p>
                </div>

                <input type="range" min="1" max="20" step="1" class="slider" data-lenghtSlider>

                 CheckBox
                <div>
                    <input type="checkbox" id="uppercase">
                    <label for="uppercase">Include Uppercase letters</label>        
                </div>

                <div>
                    <input type="checkbox" id="lowercase">
                    <label for="lowercase">Include Lowercase letters</label>        
                </div>

                <div>
                    <input type="checkbox" id="numbers">
                    <label for="uppercase">Include Numbers </label>        
                </div>

                <div>
                    <input type="checkbox" id="symbols">
                    <label for="symbols">Include Symbols </label>        
                </div>

                 Strenght section
                <div class="strength-container">
                    <p>Strength</p>
                    <div data-indicator></div>
                </div>

                <!-- generatre Password
                <button class="generateButton">GENERATE PASSWORD</button>

            </div>
    </div>


    <script src="script.js"></script> 
</body>
</html>
